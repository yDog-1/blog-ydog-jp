name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/create-github-app-token@v3.4.0
        id: articles-token
        with:
          client-id: ${{ vars.ARTICLES_CLIENT_ID }}
          private-key: ${{ secrets.ARTICLES_APP_PRIVATE_KEY }}
          owner: yDog-1
          repositories: articles
          permission-contents: read
      - run: bun run build
        env:
          ARTICLES_READ_TOKEN: ${{ steps.articles-token.outputs.token }}

  verify-actions-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.0
      - run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
