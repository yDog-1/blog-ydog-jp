query listArticles($owner: String!, $name: String!, $expression: String!) {
  repository(owner: $owner, name: $name) {
    object(expression: $expression) {
      __typename
      ... on Tree {
        entries {
          name
          object {
            __typename
            ... on Blob {
              text
            }
          }
        }
      }
    }
  }
}
